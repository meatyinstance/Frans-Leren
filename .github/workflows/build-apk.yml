name: Bouw Android-app
on:
  push:
    branches: [main]
    paths-ignore: ['www/**', 'lijst-*.csv', 'index.json']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Stel het adres van de app in
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO=${GITHUB_REPOSITORY#*/}
          node -e "const c=require('./capacitor.config.json');c.server={url:'https://$OWNER.github.io/$REPO/'};require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c))"
          cat capacitor.config.json
      - run: npx cap add android && npx cap sync android
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: frans-leren-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
